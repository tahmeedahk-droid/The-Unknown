<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gaming World</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101020;
    color: white;
    text-align: center;
}

header {
    background: #6c5ce7;
    padding: 25px;
}

h1 {
    margin: 0;
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 30px;
}

.game {
    background: #202040;
    padding: 25px;
    width: 220px;
    border-radius: 15px;
}

button {
    background: #6c5ce7;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #4834d4;
}
</style>
</head>

<body>

<header>
<h1>🎮 My Gaming World</h1>
<p>Welcome to my free gaming website!</p>
</header>

<div class="container">

<div class="game">
<h2>🐍 Snake Game</h2>
<p>Eat food and grow longer!</p>
<button onclick="alert('Snake Game Coming Soon!')">Play Game</button>
</div>

<div class="game">
<h2>🏎️ Car Racing</h2>
<p>Drive your car and avoid obstacles!</p>
<button onclick="alert('Car Racing Coming Soon!')">Play Game</button>
</div>

<div class="game">
<h2>🦘 Jumping Game</h2>
<p>Jump over obstacles!</p>
<button onclick="alert('Jumping Game Coming Soon!')">Play Game</button>
</div>

<div class="game">
<h2>🎯 Click the Target</h2>
<p>Click to earn points!</p>
<button onclick="alert('Target Game Coming Soon!')">Play Game</button>
</div>

</div>

</body>
</html>
